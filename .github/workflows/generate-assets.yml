name: Generate README Assets

on:
  schedule:
    - cron: "0 5 * * *"   # daily at 05:00 UTC (07:00 Berlin)
  workflow_dispatch:        # allow manual run

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit generated SVGs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # NOTE: GITHUB_TOKEN only has access to this repository.
      # To include private contributions from all repos, add a PAT with "repo" scope
      # as a repository secret named GH_PAT and replace ${{ secrets.GITHUB_TOKEN }}
      # below with ${{ secrets.GH_PAT }}.
      - name: Generate SVG assets
        uses: saeedata/github-contributions-svg@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet \
            && echo "No asset changes — skipping commit." \
            || git commit -m "chore: regenerate README assets [skip ci]" && git push
